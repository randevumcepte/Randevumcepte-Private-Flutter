name: rc_softphone
description: Randevumcepte SIP/WebRTC softphone modulu (sip_ua + flutter_webrtc + CallKit). Uygulamaya yalnizca `tool/softphone.sh ac` ile eklenir.
publish_to: 'none'
version: 1.0.0

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  # sip_ua 1.1.0 flutter_webrtc ^1.2 ister; 0.12.x iOS build gecmisi bilinen surum.
  sip_ua: 1.0.1
  flutter_webrtc: ^0.12.12
  flutter_callkit_incoming: ^2.5.5
  uuid: ^4.4.0
