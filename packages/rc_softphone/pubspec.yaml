name: rc_softphone
description: Ola Nail SIP/WebRTC softphone modulu (sip_ua + flutter_webrtc + CallKit). Uygulamaya yalnizca `tool/softphone.sh ac` ile eklenir.
publish_to: 'none'
version: 1.0.0

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  # sip_ua 1.1.0 flutter_webrtc ^1.2 ister; 0.12.x iOS build gecmisi bilinen surum.
  # 1.0.1 yerel yamali kopya (hold/unhold re-INVITE hatasi) -> packages/sip_ua/YAMA.md
  sip_ua:
    path: ../sip_ua
  flutter_webrtc: ^0.12.12
  # 2.5.8 yerel yamali kopya (VoIP on plan servisine microphone tipi)
  # -> packages/flutter_callkit_incoming/YAMA.md
  flutter_callkit_incoming:
    path: ../flutter_callkit_incoming
  uuid: ^4.4.0
  http: ^1.3.0
  shared_preferences: ^2.0.7
  firebase_messaging: ^15.2.5

# iOS native kopru (CallKit ses oturumu -> WebRTC). Yalnizca iOS; Android'de
# native kod yok. Paket pubspec'ten cikinca plugin kaydi + pod'u da duser,
# Runner/AppDelegate'e hicbir sey yazilmaz.
flutter:
  plugin:
    platforms:
      ios:
        pluginClass: RcSoftphonePlugin
